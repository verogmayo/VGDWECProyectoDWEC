<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Botones Colores-VéroGrué</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      .container {
        width: 100%;
        display: flex;
        text-align: center;
        align-content: center;
      }
      @media (max-width: 1100px ){
        .container{
          display: flex;
          flex-direction: column;
          align-items: center;
        }
      }
      .colores, .pizarra {
        width: 50%;
        justify-items: center;
        align-content: center;
      }
      h1 {
        margin-top: 20px;
        padding: 10px;
      }
      .inputs {
        margin: 10px;
        height: 100px;
      }
      .image {
        margin: 10px;
      }
      
      #borrarTodo{
        background: rgb(224, 182, 73);
        height: 30px;
        padding: 5px;
        border: goldenrod 1px solid;
        border-radius: 5px;
        color: white;
        font-size: 15px;
        font-weight: 700;
      }
      .instrucciones{
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 20px;
        height: 100px;
        margin: 10px;
      }
      .textoPizarra{
        font-size: 20px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="colores">
        <h1>Cambio de color con Api Canvas</h1>
        <div class="inputs">
          <label for="rojo">Rojo</label>
          <input type="range" id="rojo" min="-255" max="255" value="0" /><br>
          <label for="verde">Verde</label>
          <input type="range" id="verde" min="-255" max="255" value="0" /><br>
          <label for="azul">Azul</label>
          <input type="range" id="azul" min="-255" max="255" value="0" />
        </div>
        <div class="image">
          <canvas id="canvas" width="500" height="500"></canvas>
        </div>
      </div>
      <div class="pizarra">
        <h1>Pizarra</h1>
        <div class="instrucciones">
          <div class="textoPizarra">Dibuja con el ratón</div>
        <div class="btnBorrar"><button id="borrarTodo">Borrar todo</button></div>
        </div>
        <div class="image">
          <canvas
            id="pizarra"
            width="500"
            height="500"
            style="border: 2px solid black"
          ></canvas>
        </div>
      </div>
    </div>

    <script>
      const foto = new Image();
      foto.src = "paisaje.jpg";

      const c = document.getElementById("canvas");
      const ctx = c.getContext("2d");

      const rojo = document.getElementById("rojo");
      const verde = document.getElementById("verde");
      const azul = document.getElementById("azul");

      foto.addEventListener("load", () => {
        actualizarImagen();
      });

      function actualizarImagen() {
        // Se dibuja la imagen original que ocupa todo el lienzo
        ctx.drawImage(foto, 0, 0, c.width, c.height);

        // Se obtienen los píxeles pra poder trabjar con ellos
        let datosFoto = ctx.getImageData(0, 0, c.width, c.height);
        let aFoto = datosFoto.data; //es el array con todos los pixeles del canva
        //value devuelve un string por lo que hay que pasarlo a entero
        let valorRojo = parseInt(rojo.value);
        let valorVerde = parseInt(verde.value);
        let valorAzul = parseInt(azul.value);

        // Se modifican los colores cuando se mueva el range
        //Cada pixel ocupa 4 posiciones que reprsentan los 3 colores y el 4 la transparencia
        for (let i = 0; i < aFoto.length; i += 4) {
          //los colores están entre o y 255, por lo que se establecen los limites
          aFoto[i] = Math.min(255, Math.max(0, aFoto[i] + valorRojo)); // Rojo
          aFoto[i + 1] = Math.min(255, Math.max(0, aFoto[i + 1] + valorVerde)); // Verde
          aFoto[i + 2] = Math.min(255, Math.max(0, aFoto[i + 2] + valorAzul)); // Azul
        }

        // Se pintan los cambios
        ctx.putImageData(datosFoto, 0, 0);
      }

      // y se asignan los eventos a los input para que al cambiar la posición del input se cambie el color
      rojo.addEventListener("input", actualizarImagen);
      verde.addEventListener("input", actualizarImagen);
      azul.addEventListener("input", actualizarImagen);

      //Pizarra ----------------------------------------
      const pizarra = document.getElementById("pizarra");
      const ctx2 = pizarra.getContext("2d");

      let pintando = false;

      // Estilo del trazo
      ctx2.lineWidth = 2;
      // https://www.w3schools.com/tags/canvas_linecap.asp
      ctx2.lineCap = "round";
      ctx2.strokeStyle = "blue";

      //Empieza a dibujar
      // https://www.w3schools.com/tags/canvas_beginpath.asp
      pizarra.addEventListener("mousedown", (e) => {
        //Si haces clic en el lienzo pintando pasa a true
        pintando = true;
        //comienza el nuevo trazo
        ctx2.beginPath();
        //se va a mover según muevas el raton. 
        //https://www.w3schools.com/tags/canvas_moveto.asp
        //https://www.w3schools.com/jsref/event_offsetx.asp -> devuelve la coordenada X
        //https://www.w3schools.com/jsref/event_offsety.asp  -> devuelve la coordenada Y
        ctx2.moveTo(e.offsetX, e.offsetY);
      });

      // Dibuja mientras se mueve
      pizarra.addEventListener("mousemove", (e) => {
        //si pintando está false no
        if (!pintando) return;
        ctx2.lineTo(e.offsetX, e.offsetY);
         ctx2.stroke();
      });

      // Deja de dibujar
      pizarra.addEventListener("mouseup", () => {
        pintando = false;
        ctx2.closePath();
      });

      // Si el ratón sale del pizarra
      pizarra.addEventListener("mouseleave", () => {
        pintando = false;
      });
      const btnBorrar = document.getElementById("borrarTodo");

      btnBorrar.addEventListener("click", () => {
        ctx2.clearRect(0, 0, pizarra.width, pizarra.height);
      });


    </script>
  </body>
</html>
